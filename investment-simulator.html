<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>年利180% 投資シミュレーター</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f0f4ff;
      --white:   #ffffff;
      --border:  #dde3f5;
      --blue:    #4f6ef7;
      --blue2:   #7c9bff;
      --green:   #0fb981;
      --orange:  #ff6b3d;
      --purple:  #9b5cf6;
      --yellow:  #f59e0b;
      --text:    #1a2040;
      --muted:   #6b7a9e;
      --radius:  16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      padding: 16px;
      max-width: 640px;
      margin: 0 auto;
    }

    /* ===== ヘッダー ===== */
    .header {
      text-align: center;
      padding: 24px 0 20px;
    }

    .header-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      margin: 0 auto 12px;
      box-shadow: 0 6px 20px rgba(79,110,247,0.35);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.82rem;
    }

    /* ===== カード ===== */
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 2px 12px rgba(79,110,247,0.07);
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    /* ===== 入力 ===== */
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 400px) {
      .input-grid { grid-template-columns: 1fr; }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
    }

    input[type="number"] {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      padding: 10px 12px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="number"]:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(79,110,247,0.12);
    }

    /* ===== ボタン ===== */
    .btn {
      background: linear-gradient(135deg, var(--blue), var(--purple));
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      padding: 15px;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(79,110,247,0.35);
      letter-spacing: 0.02em;
    }

    .btn:active { opacity: 0.88; transform: scale(0.98); }

    /* ===== エラー ===== */
    .error-box {
      background: #fff0f0;
      border: 1.5px solid #ffaaaa;
      border-radius: 10px;
      color: #c0392b;
      font-size: 0.85rem;
      padding: 12px;
      margin-bottom: 14px;
      display: none;
    }

    /* ===== 結果サマリー ===== */
    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    @media (max-width: 400px) {
      .results-grid { grid-template-columns: 1fr; }
    }

    .result-box {
      border-radius: 12px;
      padding: 14px;
      position: relative;
      overflow: hidden;
    }

    .result-box::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 60px; height: 60px;
      border-radius: 50%;
      opacity: 0.12;
      transform: translate(15px, -15px);
    }

    .rb-green  { background: linear-gradient(135deg, #e8faf3, #d0f5e5); border: 1.5px solid #a8e6cc; }
    .rb-green::before { background: var(--green); }

    .rb-blue   { background: linear-gradient(135deg, #eef2ff, #dce5ff); border: 1.5px solid #b4c6ff; }
    .rb-blue::before { background: var(--blue); }

    .rb-yellow { background: linear-gradient(135deg, #fffbea, #fff3cc); border: 1.5px solid #ffd97a; }
    .rb-yellow::before { background: var(--yellow); }

    .rb-orange { background: linear-gradient(135deg, #fff2ee, #ffe4db); border: 1.5px solid #ffb49a; }
    .rb-orange::before { background: var(--orange); }

    .result-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .result-value {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
    }

    .yen {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      margin-top: 2px;
    }

    .result-sub {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 5px;
      line-height: 1.6;
    }

    .pill {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-top: 4px;
    }

    .pill-green  { background: rgba(15,185,129,0.15); color: #0a8f62; }
    .pill-blue   { background: rgba(79,110,247,0.15); color: var(--blue); }
    .pill-yellow { background: rgba(245,158,11,0.15); color: #b57b08; }
    .pill-gray   { background: rgba(107,122,158,0.15); color: var(--muted); }

    /* ===== 前提条件 ===== */
    .assumptions {
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--bg);
      border-radius: 10px;
      padding: 10px 14px;
      margin-top: 12px;
      line-height: 1.9;
      border: 1px solid var(--border);
    }

    /* ===== 複利比較 ===== */
    .comparison-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .comparison-row:last-child { border-bottom: none; }

    .comp-left { flex: 1; }
    .comp-title { font-weight: 700; font-size: 0.9rem; color: var(--text); }
    .comp-label { font-size: 0.75rem; color: var(--muted); }

    .comp-right { text-align: right; }
    .comp-value { font-weight: 800; font-size: 1rem; color: var(--text); }
    .comp-yen   { font-size: 0.75rem; color: var(--muted); }

    /* ===== グラフ ===== */
    .chart-wrap { width: 100%; }
    canvas { display: block; width: 100%; border-radius: 8px; }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 10px;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-weight: 600; }
    .legend-dot  { width: 14px; height: 3px; border-radius: 2px; }

    /* ===== テーブル ===== */
    .table-wrap {
      overflow-x: auto;
      border-radius: 10px;
      border: 1.5px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      min-width: 360px;
    }

    thead tr { background: var(--bg); }

    th {
      padding: 10px 8px;
      text-align: right;
      color: var(--muted);
      font-weight: 700;
      font-size: 0.73rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    th:first-child { text-align: left; }

    td {
      padding: 8px 8px;
      text-align: right;
      border-top: 1px solid var(--border);
      color: var(--text);
      font-weight: 600;
    }
    td:first-child { text-align: left; color: var(--muted); font-weight: 500; }

    tr:hover td { background: rgba(79,110,247,0.04); }

    tr.reinvest td { background: rgba(15,185,129,0.06); }
    tr.reinvest td:first-child { color: var(--green); font-weight: 700; }

    .td-yen { display: block; font-size: 0.67rem; color: var(--muted); font-weight: 400; }

    .show-more-btn {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 9px;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
    }
    .show-more-btn:active { opacity: 0.75; }

    .badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .badge-blue   { background: rgba(79,110,247,0.12); color: var(--blue); }
    .badge-orange { background: rgba(255,107,61,0.12); color: var(--orange); }

    .hidden { display: none; }

    /* 区切りライン */
    .divider {
      border: none;
      border-top: 1.5px solid var(--border);
      margin: 4px 0 14px;
    }

    /* ===== 日付入力 ===== */
    input[type="date"] {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      padding: 10px 12px;
      width: 100%;
      outline: none;
    }
    input[type="date"]:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(79,110,247,0.12);
    }

    /* ===== マイルストーンテーブル ===== */
    .milestone-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .milestone-row {
      border-radius: 12px;
      border: 1.5px solid var(--border);
      overflow: hidden;
    }

    .milestone-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .milestone-date {
      font-size: 0.78rem;
      font-weight: 500;
      opacity: 0.85;
    }

    .milestone-days {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(255,255,255,0.35);
    }

    .milestone-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid rgba(0,0,0,0.07);
    }

    .milestone-cell {
      padding: 10px 10px;
      text-align: center;
      border-right: 1px solid rgba(0,0,0,0.07);
    }
    .milestone-cell:last-child { border-right: none; }

    .milestone-cell-label {
      font-size: 0.67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      opacity: 0.65;
      margin-bottom: 3px;
    }

    .milestone-cell-value {
      font-size: 0.88rem;
      font-weight: 800;
    }

    .milestone-cell-yen {
      font-size: 0.68rem;
      opacity: 0.65;
      margin-top: 1px;
    }

    .milestone-cell-pct {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 3px;
      background: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>

<!-- ヘッダー -->
<div class="header">
  <div class="header-icon">📈</div>
  <h1>投資シミュレーター</h1>
  <p class="subtitle">年利180%・日利受取・$100再投資・出金5%手数料モデル</p>
</div>

<!-- エラー表示 -->
<div class="error-box" id="errorBox"></div>

<!-- 設定 + ボタン -->
<div class="card">
  <div class="card-title">
    <span class="card-title-icon" style="background:rgba(79,110,247,0.12)">⚙️</span>
    シミュレーション設定
  </div>
  <div class="input-grid">
    <div class="input-group">
      <label>初期投資額（$）</label>
      <input type="number" id="principal" value="1000" min="1" step="100" />
    </div>
    <div class="input-group">
      <label>運用日数（日）</label>
      <input type="number" id="days" value="365" min="1" step="1" />
    </div>
    <div class="input-group">
      <label>年利（%）</label>
      <input type="number" id="annualRate" value="180" min="0.1" step="0.1" />
    </div>
    <div class="input-group">
      <label>出金手数料（%）</label>
      <input type="number" id="fee" value="5" min="0" max="99" step="0.1" />
    </div>
    <div class="input-group">
      <label>再投資トリガー（$）</label>
      <input type="number" id="reinvestThreshold" value="100" min="1" step="10" />
    </div>
    <div class="input-group">
      <label>円換算レート（円/$）</label>
      <input type="number" id="jpyRate" value="155" min="1" step="1" />
    </div>
    <div class="input-group" style="grid-column: 1 / -1;">
      <label>開始日（今日の日付）</label>
      <input type="date" id="startDate" />
    </div>
  </div>

  <!-- ボタンは入力のすぐ下 -->
  <button class="btn" onclick="simulate()">📊 シミュレーション実行</button>
</div>

<!-- 結果サマリー -->
<div class="card hidden" id="summaryCard">
  <div class="card-title">
    <span class="card-title-icon" style="background:rgba(15,185,129,0.12)">💰</span>
    結果サマリー
    <span class="badge badge-blue" id="daysLabel"></span>
  </div>
  <div class="results-grid" id="summaryGrid"></div>
  <div class="assumptions" id="assumptionsText"></div>
</div>

<!-- マイルストーン -->
<div class="card hidden" id="milestoneCard">
  <div class="card-title">
    <span class="card-title-icon" style="background:rgba(155,92,246,0.12)">📅</span>
    期間別シミュレーション（単利・複利・このシミュ）
  </div>
  <div class="milestone-grid" id="milestoneGrid"></div>
</div>

<!-- 複利比較 -->
<div class="card hidden" id="compCard">
  <div class="card-title">
    <span class="card-title-icon" style="background:rgba(155,92,246,0.12)">⚖️</span>
    複利との比較
  </div>
  <div id="compRows"></div>
</div>

<!-- グラフ -->
<div class="card hidden" id="chartCard">
  <div class="card-title">
    <span class="card-title-icon" style="background:rgba(245,158,11,0.12)">📉</span>
    残高推移グラフ
  </div>
  <div class="chart-wrap">
    <canvas id="chart" height="220"></canvas>
  </div>
  <div class="chart-legend">
    <div class="legend-item"><div class="legend-dot" style="background:#0fb981"></div>このシミュレーション</div>
    <div class="legend-item"><div class="legend-dot" style="background:#4f6ef7"></div>完全複利</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>単利</div>
  </div>
</div>

<!-- 日別テーブル -->
<div class="card hidden" id="tableCard">
  <div class="card-title">
    <span class="card-title-icon" style="background:rgba(255,107,61,0.12)">📋</span>
    日別明細
    <span class="badge badge-orange">再投資日は緑色</span>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>日</th>
          <th id="thDate" class="hidden">日付</th>
          <th>元本($)<br><span style="font-weight:400">(円)</span></th>
          <th>日利($)<br><span style="font-weight:400">(円)</span></th>
          <th>累積利益($)<br><span style="font-weight:400">(円)</span></th>
          <th>出金額($)<br><span style="font-weight:400">(円)</span></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <button class="show-more-btn hidden" id="showMoreBtn" onclick="toggleFullTable()"></button>
</div>

<script>
// ===== ユーティリティ =====
function commaInt(n) {
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function commaDec(n) {
  var s = n.toFixed(2).split('.');
  s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return s.join('.');
}
function fmtUSD(v)       { return '$' + commaDec(v); }
function fmtJPY(v, rate) { return '\u00a5' + commaInt(v * rate); }
function fmtPct(v)       { return (v >= 0 ? '+' : '') + v.toFixed(1) + '%'; }

// ===== シミュレーション =====
function runSimulation(principal, days, annualRate, feePercent, threshold) {
  var dailyRate = annualRate / 100 / 365;
  var feeRate   = feePercent / 100;
  var p         = principal;
  var pending   = 0;
  var totalReinv = 0;
  var rows      = [];

  for (var d = 1; d <= days; d++) {
    var interest = p * dailyRate;
    pending += interest;

    var reinvested  = 0;
    var didReinvest = false;

    if (pending >= threshold) {
      var batches = Math.floor(pending / threshold);
      reinvested  = batches * threshold;
      p          += reinvested;
      pending    -= reinvested;
      totalReinv += reinvested;
      didReinvest = true;
    }

    rows.push({
      day: d, principal: p, interest: interest,
      pending: pending, cashout: (p + pending) * (1 - feeRate),
      didReinvest: didReinvest
    });
  }

  return {
    rows: rows, finalPrincipal: p, finalPending: pending,
    finalAssets: p + pending,
    cashout: (p + pending) * (1 - feeRate),
    profit:  (p + pending) * (1 - feeRate) - principal,
    totalReinv: totalReinv
  };
}

function compoundValue(principal, annualRate, days) {
  return principal * Math.pow(1 + annualRate / 100 / 365, days);
}

// ===== グローバル状態 =====
var lastRows = [];
var lastJpyRate = 155;
var lastStartDate = null;
var fullTableVisible = false;

// ===== メイン =====
function simulate() {
  try {
    document.getElementById('errorBox').style.display = 'none';

    var principal  = parseFloat(document.getElementById('principal').value);
    var days       = parseInt(document.getElementById('days').value, 10);
    var annualRate = parseFloat(document.getElementById('annualRate').value);
    var fee        = parseFloat(document.getElementById('fee').value);
    var threshold  = parseFloat(document.getElementById('reinvestThreshold').value);
    var jpyRate    = parseFloat(document.getElementById('jpyRate').value);

    if (isNaN(principal) || principal <= 0) principal = 1000;
    if (isNaN(days)      || days <= 0)      days      = 365;
    if (isNaN(annualRate)|| annualRate <= 0) annualRate = 180;
    if (isNaN(fee)       || fee < 0)        fee        = 5;
    if (isNaN(threshold) || threshold <= 0) threshold  = 100;
    if (isNaN(jpyRate)   || jpyRate <= 0)   jpyRate    = 155;

    lastJpyRate = jpyRate;
    fullTableVisible = false;

    var sim           = runSimulation(principal, days, annualRate, fee, threshold);
    lastRows          = sim.rows;
    var profitPct     = (sim.cashout / principal - 1) * 100;
    var compCashout   = compoundValue(principal, annualRate, days) * (1 - fee / 100);
    var simpleCashout = principal * (1 + annualRate / 100 * days / 365) * (1 - fee / 100);
    var nextReinv     = threshold - (sim.finalPending % threshold);
    if (nextReinv >= threshold) nextReinv = 0;

    // サマリー
    document.getElementById('daysLabel').textContent = days + '日間';
    document.getElementById('summaryCard').classList.remove('hidden');
    document.getElementById('summaryGrid').innerHTML =
      makeResultBox('rb-green', '最終出金額（手数料後）',
        fmtUSD(sim.cashout), fmtJPY(sim.cashout, jpyRate),
        '税引前利益: ' + fmtUSD(sim.profit) + '<br>(' + fmtJPY(sim.profit, jpyRate) + ')',
        fmtPct(profitPct), 'pill-green') +
      makeResultBox('rb-blue', '総資産（出金前）',
        fmtUSD(sim.finalAssets), fmtJPY(sim.finalAssets, jpyRate),
        '元本: ' + fmtUSD(principal) + '<br>利益: ' + fmtUSD(sim.finalAssets - principal),
        '', '') +
      makeResultBox('rb-yellow', '再投資回数',
        (sim.totalReinv > 0 ? Math.round(sim.totalReinv / threshold) : 0) + '回', '',
        '再投資総額: ' + fmtUSD(sim.totalReinv) + '<br>(' + fmtJPY(sim.totalReinv, jpyRate) + ')',
        '', '') +
      makeResultBox('rb-orange', '未払い利益（積立中）',
        fmtUSD(sim.finalPending), fmtJPY(sim.finalPending, jpyRate),
        '次の再投資まで: ' + fmtUSD(nextReinv) + ' 不足',
        '', '');

    document.getElementById('assumptionsText').innerHTML =
      '<strong>前提条件：</strong><br>' +
      '年利 ' + annualRate + '% → 日利 ' + (annualRate / 365).toFixed(4) + '% ／ ' +
      '再投資トリガー: $' + threshold + '（' + fmtJPY(threshold, jpyRate) + '） ／ ' +
      '出金手数料: ' + fee + '% ／ レート: ' + jpyRate + '円/$<br>' +
      '元本: ' + fmtUSD(principal) + '（' + fmtJPY(principal, jpyRate) + '）';

    // 複利比較
    document.getElementById('compCard').classList.remove('hidden');
    document.getElementById('compRows').innerHTML =
      makeCompRow('このシミュレーション', '日利受取 + $' + threshold + '再投資 + ' + fee + '%手数料',
        sim.cashout, jpyRate, profitPct, '#0fb981', 'pill-green') +
      makeCompRow('完全複利（日次）', '毎日全額再投資 + ' + fee + '%手数料',
        compCashout, jpyRate, (compCashout / principal - 1) * 100, '#4f6ef7', 'pill-blue') +
      makeCompRow('単利（再投資なし）', '日利を別口座で受取 + ' + fee + '%手数料',
        simpleCashout, jpyRate, (simpleCashout / principal - 1) * 100, '#f59e0b', 'pill-yellow') +
      makeCompRow('元本のみ（投資なし）', '何もしない場合',
        principal, jpyRate, 0, '#6b7a9e', 'pill-gray');

    // マイルストーン
    var startDateVal = document.getElementById('startDate').value;
    var startDate    = startDateVal ? new Date(startDateVal + 'T00:00:00') : new Date();
    lastStartDate    = startDate;
    renderMilestones(principal, annualRate, fee, threshold, jpyRate, startDate);

    // グラフ
    document.getElementById('chartCard').classList.remove('hidden');
    drawChart(sim.rows, principal, annualRate, fee);

    // テーブル
    document.getElementById('tableCard').classList.remove('hidden');
    renderTable(sim.rows, false, jpyRate);

    // 結果へスクロール
    document.getElementById('summaryCard').scrollIntoView({ behavior: 'smooth', block: 'start' });

  } catch (e) {
    var eb = document.getElementById('errorBox');
    eb.style.display = 'block';
    eb.textContent = 'エラー: ' + (e.message || e);
  }
}

function makeResultBox(cls, label, value, yen, sub, pillText, pillCls) {
  return '<div class="result-box ' + cls + '">' +
    '<div class="result-label">' + label + '</div>' +
    '<div class="result-value">' + value +
      (yen ? '<span class="yen">(' + yen + ')</span>' : '') +
    '</div>' +
    (sub ? '<div class="result-sub">' + sub + '</div>' : '') +
    (pillText ? '<div><span class="pill ' + pillCls + '">' + pillText + '</span></div>' : '') +
  '</div>';
}

function makeCompRow(title, label, value, jpyRate, pctVal, color, pillCls) {
  return '<div class="comparison-row">' +
    '<div class="comp-left">' +
      '<div class="comp-title">' + title + '</div>' +
      '<div class="comp-label">' + label + '</div>' +
    '</div>' +
    '<div class="comp-right">' +
      '<div class="comp-value" style="color:' + color + '">' + fmtUSD(value) + '</div>' +
      '<div class="comp-yen">(' + fmtJPY(value, jpyRate) + ')</div>' +
      '<span class="pill ' + pillCls + '">' + fmtPct(pctVal) + '</span>' +
    '</div>' +
  '</div>';
}

// ===== テーブル =====
function rowDate(day) {
  if (!lastStartDate) return '';
  var d = new Date(lastStartDate.getTime());
  d.setDate(d.getDate() + day);
  return (d.getMonth() + 1) + '/' + d.getDate();
}

function renderTable(rows, full, jpyRate) {
  if (jpyRate !== undefined) lastJpyRate = jpyRate;
  var rate     = lastJpyRate;
  var hasDate  = !!lastStartDate;
  var tbody    = document.getElementById('tableBody');
  var btn      = document.getElementById('showMoreBtn');
  var thDate   = document.getElementById('thDate');

  // 日付列ヘッダーの表示切替
  if (hasDate) thDate.classList.remove('hidden');
  else         thDate.classList.add('hidden');

  var displayRows;
  if (full || rows.length <= 30) {
    displayRows = rows;
    btn.classList.add('hidden');
  } else {
    displayRows = rows.slice(0, 20).concat([null]).concat(rows.slice(-5));
    btn.classList.remove('hidden');
    btn.textContent = '\u25bc 全 ' + rows.length + ' 日を表示';
  }

  var cols = hasDate ? 6 : 5;
  var html = '';
  for (var i = 0; i < displayRows.length; i++) {
    var row = displayRows[i];
    if (row === null) {
      html += '<tr><td colspan="' + cols + '" style="text-align:center;color:var(--muted);padding:8px;font-size:0.85rem">・・・</td></tr>';
      continue;
    }
    var cls = row.didReinvest ? ' class="reinvest"' : '';
    var dateTd = hasDate ? '<td style="color:var(--muted);font-size:0.78rem">' + rowDate(row.day) + '</td>' : '';
    html += '<tr' + cls + '>' +
      '<td>' + row.day + '日' + (row.didReinvest ? ' ♻' : '') + '</td>' +
      dateTd +
      '<td>' + commaDec(row.principal) + '<span class="td-yen">' + fmtJPY(row.principal, rate) + '</span></td>' +
      '<td>+' + commaDec(row.interest) + '<span class="td-yen">' + fmtJPY(row.interest, rate) + '</span></td>' +
      '<td>' + commaDec(row.pending)   + '<span class="td-yen">' + fmtJPY(row.pending, rate)   + '</span></td>' +
      '<td>' + commaDec(row.cashout)   + '<span class="td-yen">' + fmtJPY(row.cashout, rate)   + '</span></td>' +
    '</tr>';
  }
  tbody.innerHTML = html;
}

function toggleFullTable() {
  fullTableVisible = !fullTableVisible;
  renderTable(lastRows, fullTableVisible);
  var btn = document.getElementById('showMoreBtn');
  if (fullTableVisible) {
    btn.textContent = '\u25b2 折りたたむ';
    btn.classList.remove('hidden');
  } else {
    btn.textContent = '\u25bc 全 ' + lastRows.length + ' 日を表示';
  }
}

// ===== グラフ（純Canvas） =====
function drawChart(rows, principal, annualRate, fee) {
  var canvas = document.getElementById('chart');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  if (!ctx) return;

  var feeRate = fee / 100;
  var W = canvas.parentElement.clientWidth || 300;
  var H = 220;
  canvas.width  = W;
  canvas.height = H;

  var N    = rows.length;
  var step = Math.max(1, Math.floor(N / 100));
  var pts  = [];
  for (var i = 0; i < N; i += step) pts.push(rows[i]);
  if (pts[pts.length - 1] !== rows[N - 1]) pts.push(rows[N - 1]);

  var simData = [], compData = [], simpleData = [];
  for (var j = 0; j < pts.length; j++) {
    simData.push(pts[j].cashout);
    compData.push(principal * Math.pow(1 + annualRate / 100 / 365, pts[j].day) * (1 - feeRate));
    simpleData.push(principal * (1 + annualRate / 100 * pts[j].day / 365) * (1 - feeRate));
  }

  var allVals = simData.concat(compData).concat(simpleData);
  var maxVal  = 0;
  for (var k = 0; k < allVals.length; k++) { if (allVals[k] > maxVal) maxVal = allVals[k]; }
  maxVal *= 1.08;

  var PAD_L = 56, PAD_R = 14, PAD_T = 14, PAD_B = 30;
  var gW = W - PAD_L - PAD_R;
  var gH = H - PAD_T - PAD_B;

  // 背景
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // グリッド
  ctx.strokeStyle = '#e8edff';
  ctx.lineWidth = 1;
  for (var t = 0; t <= 4; t++) {
    var gy = PAD_T + gH * t / 4;
    ctx.beginPath(); ctx.moveTo(PAD_L, gy); ctx.lineTo(PAD_L + gW, gy); ctx.stroke();
    var yVal = maxVal * (1 - t / 4);
    var lbl  = yVal >= 1000 ? '$' + Math.round(yVal / 1000) + 'k' : '$' + Math.round(yVal);
    ctx.fillStyle = '#6b7a9e';
    ctx.font = '10px Arial';
    ctx.textAlign = 'right';
    ctx.fillText(lbl, PAD_L - 4, gy + 4);
  }

  // X軸ラベル
  ctx.fillStyle = '#6b7a9e';
  ctx.font = '10px Arial';
  ctx.textAlign = 'center';
  var xIdxs = [0, Math.floor(pts.length / 2), pts.length - 1];
  for (var xi = 0; xi < xIdxs.length; xi++) {
    var idx = xIdxs[xi];
    var xp  = PAD_L + gW * idx / (pts.length - 1 || 1);
    ctx.fillText(pts[idx].day + '日', xp, H - 8);
  }

  function px(i) { return PAD_L + gW * i / (simData.length - 1 || 1); }
  function py(v) { return PAD_T + gH * (1 - v / maxVal); }

  // 塗りつぶし（シミュレーション）
  var grad = ctx.createLinearGradient(0, PAD_T, 0, PAD_T + gH);
  grad.addColorStop(0, 'rgba(15,185,129,0.18)');
  grad.addColorStop(1, 'rgba(15,185,129,0.01)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  for (var fi = 0; fi < simData.length; fi++) {
    if (fi === 0) ctx.moveTo(px(fi), py(simData[fi]));
    else          ctx.lineTo(px(fi), py(simData[fi]));
  }
  ctx.lineTo(px(simData.length - 1), PAD_T + gH);
  ctx.lineTo(PAD_L, PAD_T + gH);
  ctx.closePath();
  ctx.fill();

  function drawLine(data, color, dash) {
    ctx.strokeStyle = color;
    ctx.lineWidth   = 2.5;
    ctx.setLineDash(dash || []);
    ctx.beginPath();
    for (var di = 0; di < data.length; di++) {
      if (di === 0) ctx.moveTo(px(di), py(data[di]));
      else          ctx.lineTo(px(di), py(data[di]));
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  drawLine(simpleData, '#f59e0b', [5, 4]);
  drawLine(compData,   '#4f6ef7', [7, 3]);
  drawLine(simData,    '#0fb981');
}

// ===== マイルストーン =====
function addMonths(date, months) {
  var d = new Date(date.getTime());
  d.setMonth(d.getMonth() + months);
  return d;
}

function fmtDate(d) {
  return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
}

function renderMilestones(principal, annualRate, fee, threshold, jpyRate, startDate) {
  var card = document.getElementById('milestoneCard');
  var grid = document.getElementById('milestoneGrid');
  card.classList.remove('hidden');

  var milestones = [
    { label: '3ヶ月後',  date: addMonths(startDate, 3),  color: '#0fb981', bg: 'linear-gradient(135deg,#d0f5e8,#b8f0d8)', border: '#82dbb8' },
    { label: '6ヶ月後',  date: addMonths(startDate, 6),  color: '#4f6ef7', bg: 'linear-gradient(135deg,#dce5ff,#c8d8ff)', border: '#9ab2ff' },
    { label: '12ヶ月後', date: addMonths(startDate, 12), color: '#9b5cf6', bg: 'linear-gradient(135deg,#ede0ff,#ddc8ff)', border: '#c49aff' },
    { label: '2年後',    date: addMonths(startDate, 24), color: '#f59e0b', bg: 'linear-gradient(135deg,#fff3cc,#ffe8a0)', border: '#ffd260' }
  ];

  var html = '';
  for (var i = 0; i < milestones.length; i++) {
    var m    = milestones[i];
    var days = Math.round((m.date - startDate) / 86400000);
    if (days <= 0) days = 1;

    // このシミュレーション
    var sim    = runSimulation(principal, days, annualRate, fee, threshold);
    var simVal = sim.cashout;
    var simPct = (simVal / principal - 1) * 100;

    // 完全複利
    var compVal = compoundValue(principal, annualRate, days) * (1 - fee / 100);
    var compPct = (compVal / principal - 1) * 100;

    // 単利
    var simpVal = principal * (1 + annualRate / 100 * days / 365) * (1 - fee / 100);
    var simpPct = (simpVal / principal - 1) * 100;

    html +=
      '<div class="milestone-row" style="border-color:' + m.border + '">' +
        '<div class="milestone-header" style="background:' + m.bg + ';color:' + m.color + '">' +
          '<span>' + m.label + '</span>' +
          '<span class="milestone-date">' + fmtDate(m.date) + '</span>' +
          '<span class="milestone-days">' + days + '日</span>' +
        '</div>' +
        '<div class="milestone-body" style="background:#fff">' +
          makeMilestoneCell('単利', simpVal, simpPct, jpyRate, m.color) +
          makeMilestoneCell('複利（日次）', compVal, compPct, jpyRate, m.color) +
        '</div>' +
      '</div>';
  }
  grid.innerHTML = html;
}

function makeMilestoneCell(label, value, pct, jpyRate, color) {
  return '<div class="milestone-cell">' +
    '<div class="milestone-cell-label">' + label + '</div>' +
    '<div class="milestone-cell-value" style="color:' + color + '">' + fmtUSD(value) + '</div>' +
    '<div class="milestone-cell-yen">' + fmtJPY(value, jpyRate) + '</div>' +
    '<div class="milestone-cell-pct">' + fmtPct(pct) + '</div>' +
  '</div>';
}

// ===== 起動 =====
window.onload = function() {
  // 今日の日付をデフォルトにセット
  var today = new Date();
  var yyyy  = today.getFullYear();
  var mm    = ('0' + (today.getMonth() + 1)).slice(-2);
  var dd    = ('0' + today.getDate()).slice(-2);
  document.getElementById('startDate').value = yyyy + '-' + mm + '-' + dd;
  simulate();
};
</script>
